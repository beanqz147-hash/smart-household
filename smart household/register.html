<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account | Smart Household Finance</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="auth-body">

    <div class="auth-container">

        <div class="auth-brand">
            <div class="brand-icon">₣</div>
            <h1>Smart<span>Finance</span></h1>
            <p>Manage your household money smarter.</p>
        </div>

        <div class="auth-card">
            <h2>Create Account</h2>
            <p class="muted">Register to get started.</p>

            <form id="registerForm">

                <label>Full Name</label>
                <input type="text" id="registerName"
                       placeholder="Enter your full name" required>

                <label>Email Address</label>
                <input type="email" id="registerEmail"
                       placeholder="Enter your email" required>

                <label>Password</label>
                <input type="password" id="registerPassword"
                       placeholder="Create a password" minlength="6" required>

                <label>Confirm Password</label>
                <input type="password" id="confirmPassword"
                       placeholder="Confirm your password" required>

                <button type="submit" class="primary-btn full-btn">
                    Create Account
                </button>

                <p id="registerMessage" class="message"></p>
            </form>

            <p class="auth-switch">
                Already have an account?
                <a href="index.html">Login</a>
            </p>
        </div>

    </div>

    <script src="app.js"></script>
    <script src="auth.js"></script>
</body>
</html>

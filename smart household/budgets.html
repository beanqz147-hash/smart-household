<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Budgets | SmartFinance</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="layout">
<aside class="sidebar">
<div class="logo">₣ Smart<span>Finance</span></div>
<p class="nav-label">MAIN MENU</p>
<nav>
<a href="dashboard.html">▦ Dashboard</a>
<a href="income.html">↗ Income</a>
<a href="expenses.html">↙ Expenses</a>
<a class="active" href="budgets.html">▤ Budgets</a>
<a href="goals.html">◎ Financial Goals</a>
<a href="reports.html">▥ Reports</a>
<a href="settings.html">⚙ Settings</a>
</nav>
<button class="logout-btn" onclick="logout()">↪ Logout</button>
</aside>

<main class="main-content">
<header class="topbar">
<div><h2>Household Budgets</h2><p class="date-display">Plan and monitor your monthly spending limits.</p></div>
</header>

<section class="panel">
<h3>Create a Budget</h3>
<form id="budgetForm" class="form-grid">
<div>
<label>Category</label>
<select id="budgetCategory" required>
<option value="">Select category</option>
<option>Food</option><option>Housing</option><option>Transport</option>
<option>Utilities</option><option>Education</option><option>Healthcare</option>
<option>Entertainment</option><option>Other</option>
</select>
</div>
<div>
<label>Budget Amount (KSh)</label>
<input type="number" id="budgetAmount" min="1" step="0.01" placeholder="Enter budget" required>
</div>
<div>
<label>Month</label>
<input type="month" id="budgetMonth" required>
</div>
<button class="primary-btn" type="submit">+ Create Budget</button>
</form>
</section>

<section class="panel">
<h3>Your Budget Plans</h3>
<div id="budgetList" class="budget-list">
<p class="muted">No budgets created yet.</p>
</div>
</section>
</main>
</div>
<script src="app.js"></script>
<script src="budgets.js"></script>
</body>
</html>

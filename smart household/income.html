<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Income | SmartFinance</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="layout">
<aside class="sidebar">
<div class="logo">₣ Smart<span>Finance</span></div>
<p class="nav-label">MAIN MENU</p>
<nav>
<a href="dashboard.html">▦ Dashboard</a>
<a class="active" href="income.html">↗ Income</a>
<a href="expenses.html">↙ Expenses</a>
<a href="budgets.html">▤ Budgets</a>
<a href="goals.html">◎ Financial Goals</a>
<a href="reports.html">▥ Reports</a>
<a href="settings.html">⚙ Settings</a>
</nav>
<button class="logout-btn" onclick="logout()">↪ Logout</button>
</aside>

<main class="main-content">
<header class="topbar">
<div><h2>Income Management</h2><p class="date-display">Record and manage household income.</p></div>
</header>

<div class="summary-card green small-summary">
<p>Total Income</p>
<h2 id="incomeTotal">KSh 0.00</h2>
<span>Your recorded income</span>
</div>

<section class="panel">
<h3>Add New Income</h3>
<form id="incomeForm" class="form-grid">
<div>
<label>Income Source</label>
<input type="text" id="incomeSource" placeholder="e.g. Salary" required>
</div>
<div>
<label>Amount (KSh)</label>
<input type="number" id="incomeAmount" min="0.01" step="0.01" placeholder="Enter amount" required>
</div>
<div>
<label>Date</label>
<input type="date" id="incomeDate" required>
</div>
<div>
<label>Category</label>
<select id="incomeCategory" required>
<option value="">Select category</option>
<option>Salary</option><option>Business</option><option>Freelance</option>
<option>Investment</option><option>Other</option>
</select>
</div>
<div class="form-wide">
<label>Description</label>
<input type="text" id="incomeDescription" placeholder="Optional details">
</div>
<button class="primary-btn" type="submit">+ Add Income</button>
</form>
</section>

<section class="panel">
<h3>Income Records</h3>
<div class="table-wrap">
<table>
<thead><tr><th>Source</th><th>Category</th><th>Date</th><th>Amount</th><th>Action</th></tr></thead>
<tbody id="incomeList"><tr><td colspan="5">No income recorded yet.</td></tr></tbody>
</table>
</div>
</section>
</main>
</div>
<script src="app.js"></script>
<script src="income.js"></script>
</body>
</html>
